# Treatment arm config overrides.
# Inherits from swebench.yaml + shared.yaml. The ONLY difference from control:
# qi instruction appended to instance_template, plus qi + DB volume-mounted
# into the container (run_args set by a per-instance temp config generated by
# run_one.py).

agent:
  instance_template: |
    <pr_description>
    {{task}}
    </pr_description>

    <instructions>
    Fix the issue above by editing source files in /testbed.
    Do NOT modify test files.

    A code-index tool (qi) is available. It navigates by symbol structure rather
    than text search — every function, type, and import is already indexed and
    instantly searchable. Use qi INSTEAD of grep/ag/rg for code exploration.

    Core commands (use in this order on every file you investigate):

    `qi '*' -f <file> --toc`       — First thing when entering a new file: every
                                     function/type/import at a glance. Faster
                                     than opening the file and scrolling.
    `qi <symbol> --def -e`         — Once you spot a relevant symbol, read its
                                     full definition with --raw for cleaner output
    `qi <symbol> --usage`          — Before editing: who calls this? What do they
                                     pass? Prevents breaking callers you forgot.
    `qi '*' --within <function>`   — What's defined inside a specific function body?

    Finding files: use grep to locate candidate files or directories, then either
    `qi '*' --toc -f <file>` to explore a specific file, or `qi '*' --files -f 'dir/'`
    to list indexed files in a directory.

    Output control:
    `qi <symbol> --def -l 5`       — --limit caps results (useful on large codebases)
    `qi <symbol> --def -e --raw`   — --raw drops the table header; cleaner for reading

    Start every session with: qi --help
    
    When done, submit your changes as a git patch:
    1. `git diff -- <your-files> > patch.txt`
    2. Verify: `cat patch.txt`
    3. Submit (BOTH parts, single command): `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt`
    </instructions>


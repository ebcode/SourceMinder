# Treatment arm config overrides (variant: "stay-in-qi").
# Inherits from swebench.yaml + shared.yaml. Same mechanics as treatment.yaml
# (qi instruction appended to instance_template; qi + DB mounted into the
# container via the per-instance config generated by run_one.py).
#
# Hypothesis under test: a WORKFLOW-FIRST + RESTRAINT prompt beats the
# flag-menu style of new-treatment.yaml. new-treatment taught many filters and
# the model stacked them into dead queries (~29% zero-result rate) and dropped
# qi after ~3 turns. This variant leads with a short workflow, tells the model
# to start broad and add at most one filter at a time, explains that qi
# self-heals on empty results, and pushes it to stay in qi rather than revert
# to grep.

agent:
  instance_template: |
    <pr_description>
    {{task}}
    </pr_description>

    <instructions>
    Fix the issue above by editing source files in /testbed.
    Do NOT modify test files.

    Use qi -- a code-index tool -- instead of grep/sed for code navigation.
    Think of it as a BETTER GREP that understands symbols (functions, types,
    variables, callers) rather than raw text.

    Start the session by running: qi --help

    THE WORKFLOW (overview -> locate -> understand):
    1. `qi -f <file> --toc`        — a file's functions and types at a glance
    2. `qi <symbol>`               — find a symbol anywhere (start here; broad)
    3. `qi <symbol> -i func -e`    — expand one specific definition
    4. `qi <symbol> --usage`       — every caller across the codebase

    START BROAD, THEN NARROW BY ONE FILTER AT A TIME.
    Run `qi <symbol>` first. Only if there are too many results, add a SINGLE
    filter and look again:
      -i func class    limit to functions/classes     -f <file>        one file/glob
      -x noise         drop comments & strings         --within <func>  inside a function
      -l 10            cap the result count            --def / --usage  definitions vs callers
    Do NOT stack several filters on a first query -- that usually returns nothing.

    IF A QUERY RETURNS NOTHING:
    qi already retried it as `*pattern*` for you, so an empty result means the
    symbol truly isn't there OR your filters are too tight. Read qi's hint and
    loosen ONE filter. Don't switch to grep -- go broader in qi instead.

    KEEP OUTPUT SMALL:
    Prefer `--toc`, `-l N`, and `-i` to keep results compact. Reach for `-e`
    (expand full body) or `-v` (all columns) only on a SINGLE symbol you have
    already located -- expanding a class can dump a whole file.

    STAY IN QI:
    After you locate the code, keep using qi to understand it -- `--usage` for
    callers, `qi '*' --within <func> -v` for a function's internals. Don't drop
    back to grep after the first hit. If qi genuinely cannot find something,
    fall back to grep to get unblocked, then return to qi.

    NOTE -- qi takes MULTIPLE values per argument (non-standard for a UNIX tool):
    `qi user session token`        — user OR session OR token (OR logic)
    `qi user -i func var prop`     — functions OR variables OR properties
    `qi malloc -f *.c *.h`         — across all .c OR .h files
    Put the search pattern FIRST, then flags -- `-f` greedily consumes every
    following filename, so `qi -f file.py symbol` wrongly treats `symbol` as a
    filename.

    When done, submit your changes as a git patch:
    1. `git diff -- <your-files> > patch.txt`
    2. Verify: `cat patch.txt`
    3. Submit (BOTH parts, single command): `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt`
    </instructions>

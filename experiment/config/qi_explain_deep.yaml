# qi Internals — Deep explanation.
# Hypothesis: giving the agent the FULL internal model — schema, indexes,
# query construction, the self-healing `*pattern*` retry, and common failure
# modes — will make it a power user. It can now debug its own queries.
#
# Deep level: CREATE TABLE, indexes with NOCASE collation, query building
# flow, proximity_results temp table, known pitfalls. This is essentially
# the developer documentation for qi.

agent:
  instance_template: |
    <pr_description>
    {{task}}
    </pr_description>

    <instructions>
    Fix the issue above by editing source files in /testbed.
    Do NOT modify test files.

    Use qi (query-index) -- a code search tool -- in lieu of grep for code navigation.

    Think of qi as a 'better grep' for coming up-to-speed quickly on an unfamiliar codebase.
    
    WHAT QI ACTUALLY IS — a SQL query tool over a code index database.

    qi is NOT a search engine or a grep alternative. It is a thin CLI
    wrapper around a pre-built SQLite database. Before your session starts,
    every symbol in the codebase was parsed by a language-specific indexer
    (python tree-sitter grammar) and inserted into a `code_index` table. qi
    translates your flags into a SELECT query and formats the result.

    THE SCHEMA — every query is a SELECT * FROM code_index WHERE (...):

      CREATE TABLE code_index (
        symbol       TEXT NOT NULL,    -- the identifier: "parse_config"
        directory    TEXT NOT NULL,    -- directory path
        filename     TEXT NOT NULL,    -- e.g. "utils.py"
        line         INTEGER NOT NULL, -- line number
        context      TEXT NOT NULL,    -- type: FUNC, VAR, CLASS, ARG, etc.
        full_symbol  TEXT NOT NULL,    -- fully qualified: "Config.parse_config"
        source_location TEXT,          -- source location info
        parent_symbol TEXT,            -- accessed member: "patterns" in patterns->count
        scope        TEXT,             -- public, private, protected
        namespace    TEXT,             -- language namespace
        modifier     TEXT,             -- static, const, inline, etc.
        type         TEXT,             -- type annotation: "int *"
        is_definition INTEGER,        -- 1=definition, 0=usage/call
        clue         TEXT              -- context hint text
      );

    FLAG → WHERE CLAUSE MAPPING (exact SQL that gets built):

      qi <p>               →  (symbol LIKE '%p%' OR full_symbol LIKE '%p%' ...)
                                  GLOB for * wildcards: '*user*' → GLOB '*user*'
      -i func var class    →  context IN ('FUNC','VAR', 'CLASS')
      -x noise             →  context NOT IN ('COMMENT','STRING')
      -x TYPE...           →  context NOT IN (TYPE,...)
      -f file.py           →  filename LIKE '%file.py'
      -f 'dir/'            →  directory LIKE '%dir/' OR filename LIKE 'dir/%'
      -p %parent%          →  parent_symbol LIKE '%parent%'
      -s %public%          →  scope LIKE '%public%'
      -m %static%          →  modifier LIKE '%static%'
      -ns %MyApp%          →  namespace LIKE '%MyApp%'
      -t 'int *'           →  type = 'int *'
      --def / -d 1         →  is_definition = 1
      --usage / -d 0       →  is_definition = 0
      -l 10                →  LIMIT 10 (applied AFTER all WHERE filters)
      -lpf 3               →  LIMIT 3 per file (post-processing)
      -e                   →  expand definition (computed from source_location and pulled from the filesystem)
      --toc                →  special query: GROUP BY filename, context
      -v                   →  verbose columns (NOT a WHERE clause)
      --debug              →  SEE THE SQL QUERY

    PROXIMITY SEARCH (--and):
      When you run `qi <a> <b> --and`, qi creates a temp table
      `proximity_results` containing only rows where BOTH patterns appear
      on the same or nearby lines within the same file. This requires a
      two-pass query: first find candidates, then check proximity.

    SELF-HEALING RETRY:
      If your query returns zero rows, qi automatically retries it as
      `*pattern*` (GLOB matching) before reporting "No results". So if
      you see "No results", it means NO row in the entire index matches
      your pattern — even as a substring — OR your WHERE filters excluded
      everything. The fix is ALWAYS: loosen one filter, not switch to grep.

    COMMON FAILURE MODES (why your query returned nothing):
      1. Too many -i/-x filters stacked → WHERE context = X AND context = Y
         (contradiction; context can only have one value per row)
      2. -i func on a language where it's called FUNCTION not FUNC
         (check the context enum: FUNC, ARG, VAR, CLASS, TYPE, INTERFACE,
          ENUM, ENUM_CASE, TRAIT, PROPERTY, CALL, IMPORT, EXPORT,
          NAMESPACE, COMMENT, STRING, LAMBDA, MACRO, EXCEPTION)
      3. -p set but the symbol has no parent (top-level declarations)
      4. -t (type filter) on untyped languages or dynamic code
      5. -ns on code without explicit namespace declarations

    COMPOSE -- qi IS A UNIX FILTER (chain and pipe in ONE command):
    Each shell turn re-sends the whole session, so a turn is expensive. Gather in
    batches, not one query per turn.
    - Batch independent lookups for a symbol you've located into a single command:
      `qi % -f utils.py --toc;  qi parse_config -i func -e | head -40;  qi parse_config --usage -l 10`
    - Pipe to cap or count instead of running another turn:
      `qi '*handler*' -x noise | head -30`      `qi parse -x noise | wc -l`
    - One rich action beats three small turns. Only split when your NEXT query
      depends on what you just saw (find a symbol, THEN inspect its caller).

    NOTE -- one non-standard quirk: qi takes MULTIPLE values per argument:
    `qi user session token`        — user OR session OR token (OR logic)
    `qi malloc -f *.c *.h`         — across all .c OR .h files
    Put the search pattern FIRST, then flags -- `-f` greedily consumes every
    following filename, so `qi -f file.py symbol` wrongly treats `symbol` as a
    filename.
    
    NEVER abandon qi. grep is NOT an alternative — it searches raw text
    without understanding structure. Use grep ONLY when you need text that
    is not in the index (comments, README, config files). If you use grep,
    return to qi on your very next command.

    THE WORKFLOW:
    1. `qi '*' -f <file> --toc`       -- overview of a file
    2. `qi <symbol> -x noise -l 10`   -- locate (broad, capped, clean)
    3. `qi <symbol> -i func -e`       -- expand one definition
    4. `qi <symbol> --usage -l 10`    -- find all callers

    Cap Every Search: *ALWAYS* add `-l N`. And *ALWAYS* add `-x noise` unless you're specifically searching for symbols inside comments and strings.

    Start the session by running: qi --help

    When done, submit your changes as a git patch:
    1. `git diff -- <your-files> > patch.txt`
    2. Verify: `cat patch.txt`
    3. Submit (BOTH parts, single command): `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt`
    </instructions>

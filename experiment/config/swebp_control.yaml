cost_tracking: ignore_errors

agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.

    Your response MUST contain exactly ONE bash code block with ONE command (or commands connected with && or ||).
    Include a THOUGHT section before your command where you explain your reasoning process.
    Format your response as shown in EXAMPLE_RESPONSE.
    CRITICAL!! NEVER issue commands in < > (angle brackets); ALWAYS use the following format:

    ## Formatting your response

    Here is an example of a correct response:

    #EXAMPLE_RESPONSE:
    THOUGHT: I need to understand the structure of the repository first. Let me check what files are in the current directory to get a better understanding of the codebase.

    ```bash
    ls -la
    ```
    #END_EXAMPLE_RESPONSE    

    Failure to follow these rules will cause your response to be rejected.
    To finish, issue the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    without any other command.
  instance_template: |
    #UPLOADED_FILES:
    {{working_dir}}
    #END_UPLOADED_FILES
    I've uploaded a code repository in the directory {{working_dir}}. Consider the following PR description:

    #PR_DESCRIPTION:
    {{task}}
    #END_PR_DESCRIPTION

    Can you help me implement the necessary changes to the repository so that the requirements specified in the PR_DESCRIPTION are met?
    I've already taken care of all changes to any of the test files described in the PR_DESCRIPTION. This means you DON'T have to modify the testing logic or any of the tests in any way!
    Your task is to make the minimal changes to non-tests files in the {{working_dir}} directory to ensure the PR_DESCRIPTION is satisfied.

    Follow these steps to resolve the issue:
    1. As a first step, it might be a good idea to find and read code relevant to the PR_DESCRIPTION
    2. Create a script to reproduce the error and execute it to confirm the error
    3. Edit the sourcecode of the repo to resolve the issue
    4. Rerun your reproduce script and confirm that the error is fixed!
    5. Think about edgecases and make sure your fix handles them as well
    Your thinking should be thorough and so it's fine if it's very long.

    ## Important Rules

    1. Every response must contain exactly one action
    2. The action must be enclosed in triple backticks
    3. Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
       Each new subshell ALREADY starts in {{working_dir}}, so do NOT prefix commands with `cd {{working_dir}}`. Just run your command directly.
       Only prefix a `cd` when you need a *DIFFERENT* directory for that one command: `MY_ENV_VAR=MY_VALUE cd /other/path && ...`. You can also write/load environment variables from files.
    4. To finish, issue the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
       Do not combine it with any other command.

    ## Useful command examples

    ### Create a new file:

    ```bash
    cat <<'EOF' > newfile.py
    import numpy as np
    hello = "world"
    print(hello)
    EOF
    ```

    ### Edit files with sed:

    ```bash
    # Replace all occurrences
    sed -i 's/old_string/new_string/g' filename.py

    # Replace only first occurrence
    sed -i 's/old_string/new_string/' filename.py

    # Replace first occurrence on line 1
    sed -i '1s/old_string/new_string/' filename.py

    # Replace all occurrences in lines 1-10
    sed -i '1,10s/old_string/new_string/g' filename.py
    ```

    ### View file content:

    ```bash
    # View specific lines with numbers
    nl -ba filename.py | sed -n '10,20p'
    ```

    ### Any other command you want to run

    ```bash
    anything
    ```

  action_observation_template: |
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Please try a different command that produces less output.
    If you're looking at a file you can try use head, tail or sed to view a smaller number of lines selectively.
    If you're using grep or find and it produced too much output, you can use a more selective search pattern.
    If you really need to see something from the full command's output, you can redirect output to a file and then search in that file.
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
  format_error_template: |
    Please always provide EXACTLY ONE action in triple backticks, found {{actions|length}} actions.
    If you want to end the task, please issue the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    without any other command.
    Else, please format your response exactly as follows:

    <response_example>
    Here are some thoughts about why you want to perform the action.

    ```bash
    <action>
    ```
    </response_example>

    Note: In rare cases, if you need to reference a similar format in your command, you might have
    to proceed in two steps, first writing TRIPLEBACKTICKSBASH, then replacing them with ```bash.
  step_limit: 250
  cost_limit: 0.
environment:
  # Pro images check out the repo at /app; start the container there so commands
  # run in the repo and {{working_dir}} (auto-detected via `pwd`) resolves to /app.
  environment_class: docker
  cwd: /app
  timeout: 180
  # jefzda Pro images set ENTRYPOINT ["/bin/bash"], so the scaffold's default
  # `<image> sleep <timeout>` becomes `/bin/bash sleep ...` and the container
  # dies at startup (exit 126). Clear the entrypoint so `sleep` runs directly and
  # the container stays alive. (Scale's official runs used Modal, not Docker, so
  # never hit this.) Replaces the default run_args, so --rm is restated here.
  run_args: ["--rm", "--network", "none", "--entrypoint", ""]
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
run:
  # Per-container startup, run once by get_sb_environment before the agent starts.
  # Two ordered steps; must exit 0 or the run aborts (set -e).
  #
  # 1. before_repo_set_cmd: the dataset's repo setup -- resets to {{base_commit}},
  #    cleans, then `git checkout <fix> -- <test files>` to apply the test_patch
  #    (the failing tests) WITHOUT the gold solution (which stays at base on disk).
  #    This needs the fix commit present, so it runs FIRST.
  #
  # 2. Contamination guard (ref-only). The jefzda Pro images ship the full upstream
  #    history with the gold fix commit still reachable from main/master, so an
  #    agent could `git log --all` / `git show <fix>` to copy the real solution
  #    (this is how the openlibrary control reps "solved" -- see work summaries).
  #    before_repo_set_cmd's `git checkout <base>` already detached HEAD at base;
  #    here we delete every branch/remote/tag ref and prune, making the fix commit
  #    unreachable. This is ref-only on purpose: no `reset --hard`/`clean`, so the
  #    test files just checked out survive (their blobs stay referenced by the
  #    index). The full ancestor history is preserved, so `git diff`/`git log`/blame
  #    still show the pre-existing state and the agent can tell a failing test is
  #    pre-existing, not its own change.
  env_startup_command: |-
    set -e
    cd /app
    {{before_repo_set_cmd}}
    ln -sf /usr/local/go/bin/go /usr/local/bin/go || true
    git remote remove origin 2>/dev/null || true
    git for-each-ref --format='delete %(refname)' refs/heads refs/remotes refs/tags | git update-ref --stdin
    git reflog expire --expire=now --all
    git gc --prune=now --quiet
model:
  model_kwargs:
    temperature: 0.0
    drop_params: true

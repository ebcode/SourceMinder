# Hybrid arm: new-treatment base + claude-flavor discipline.
# new-treatment had the LOWEST peak-prompt tokens of the four prompt_study arms
# (its -x noise habit and -l/-lpf limit teaching kept output small) but middling
# adherence and a high dead-query rate (38% on flash). This keeps new-treatment's
# flag-menu teaching and limit emphasis, and layers in claude.yaml's discipline:
# "start broad / narrow by one filter", the self-heal note, and "stay in qi" --
# aiming to lift adherence and cut dead queries WITHOUT losing the token savings.

agent:
  instance_template: |
    <pr_description>
    {{task}}
    </pr_description>

    <instructions>
    Fix the issue above by editing source files in /testbed.
    Do NOT modify test files.

    A code-index tool (qi) should be used in lieu of grep/sed for code
    navigation. Think of qi as a BETTER GREP for *symbolic* code search.

    Start the session by running: qi --help

    Core commands (prefer the SMALL-output ones -- they keep context lean):
    `qi -f <file> --toc`          — every function and type in a file at a glance
    `qi <symbol> -x noise`        — find a symbol; -x noise drops comment/string
                                     hits (add it to almost every search)
    `qi <symbol> -l 5`            — limit to 5 results (same as --limit 5)
    `qi <symbol> -lpf 3 -l 15`    — 3 per file, 15 total, for sampling
    `qi <symbol> -i func class`   — only functions/classes
    `qi <symbol> --usage`         — all callers across the codebase
    `qi <symbol> --def -e`        — expand ONE definition (only after you have
                                     located it; expanding a class dumps a file)
    `qi '*' --within <func> -v`   — every symbol inside a function, typed/scoped

    WORKFLOW: overview -> locate -> understand
    `qi -f <file> --toc`                — a file's table of contents
    `qi <symbol> -x noise -l 10`        — locate a symbol (broad, but capped)
    `qi <symbol> -i func -e`            — expand the one you want
    `qi <symbol> --usage -C 3`          — see how it's called

    START BROAD, THEN NARROW BY ONE FILTER AT A TIME.
    Run `qi <symbol> -x noise` first. Only if there are too many results, add a
    SINGLE filter (`-i func`, `-f <file>`, `--within <func>`, `-p <parent>`) and
    look again. Do NOT stack several filters on a first query -- that usually
    returns nothing.

    IF A QUERY RETURNS NOTHING:
    qi already retried it as `*pattern*`, so an empty result means the symbol
    isn't there OR your filters are too tight. Read qi's hint and loosen ONE
    filter -- don't switch to grep, go broader in qi.

    STAY IN QI:
    After you locate the code, keep using qi to understand it -- `--usage` for
    callers, `qi '*' --within <func> -v` for a function's internals. Don't drop
    back to grep after the first hit. If qi genuinely cannot find something,
    fall back to grep to get unblocked, then return to qi.

    qi takes MULTIPLE values per argument (non-standard for a UNIX tool):
    `qi user session token`        — user OR session OR token (OR logic)
    `qi user -i func var prop`     — functions OR variables OR properties
    `qi malloc -f *.c *.h`         — across all .c OR .h files
    Put the search pattern FIRST, then flags -- `-f` greedily consumes every
    following filename, so `qi -f file.py symbol` wrongly treats `symbol` as a
    filename.

    When done, submit your changes as a git patch:
    1. `git diff -- <your-files> > patch.txt`
    2. Verify: `cat patch.txt`
    3. Submit (BOTH parts, single command): `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt`
    </instructions>

# Treatment arm config overrides.
# Inherits from swebench.yaml + shared.yaml. The ONLY difference from control:
# qi instruction appended to instance_template, plus qi + DB volume-mounted
# into the container (run_args set by a per-instance temp config generated by
# run_one.py).

agent:
  instance_template: |
    <pr_description>
    {{task}}
    </pr_description>

    <instructions>
    Fix the issue above by editing source files in /testbed.
    Do NOT modify test files.

    A code-index tool (qi) should be used in lieu of your usual Search/Grep/Read tools.
    Think of qi as a BETTER GREP for *symbolic* code navigation!
    Use these commands to get familiar with the tool right away:

    `qi -f <file> --toc`          — every function and type in a file at a glance
    `qi <symbol> -x noise`        — exclude symbols appearing in comments or strings (same as: --exclude-context str com)
    `qi <symbol> --def -e -v`     — full definition with parent, scope, and type annotations
    `qi '*' --within <func> -v`   — every symbol inside a function body, typed and scoped
    `qi <a> <b> --and`            — lines where two symbols appear together
    `qi '*' --lines N-M`          — all symbols in a specific line range
    `qi <symbol> --usage`         — all callers across the entire codebase
    `qi <symbol> -i func class`   — include only functions and classes (same as: --include-context func class)
    `qi <symbol> -l 5`            — limit to 5 results (same as: --limit 5)
    `qi <symbol> -p data -l 10`   — filter and limit results having parent=data
    
    QI WORKFLOW: overview -> discover -> expand
    
    `qi '*' -f <file> --toc`                 — A file's 'Table of Contents' view
    `qi '*<symbol>*' -i func --def -l 10`    — Find functions of interest
    `qi <symbol> -i func -e`                 — Expand a specific function
    `qi <symbol> --usage -C 5`               — Find usage examples with 5 lines of surrounding context (default: 3)
    
    IMPORTANT NOTE ON QI SYNTAX: Multi-Value Arguments (Non-Standard UNIX Pattern)
    Unlike most UNIX tools, qi accepts multiple values for both the main pattern and subsequent flags:
    
    # Multiple search patterns (OR logic)
    `qi user session token -l 20`            — Find user OR session OR token

    # Multiple context types (OR logic)
    `qi user -i func var prop`               — Functions OR variables OR properties

    # Multiple file patterns (OR logic)
    `qi symbol -f file1.c file2.c utils.h`   — In any of these files
    `qi malloc -f *.c *.h`                   — All .c OR .h files

    # Combine multiple values across arguments
    `qi malloc free -i func call -f memory.c allocator.c buffer.c`

    Start the session by running: qi --help. *ALWAYS* prefer it to grep for code exploration for this task.
    
    When done, submit your changes as a git patch:
    1. `git diff -- <your-files> > patch.txt`
    2. Verify: `cat patch.txt`
    3. Submit (BOTH parts, single command): `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt`
    </instructions>

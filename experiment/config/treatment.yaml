# Treatment arm config overrides.
# Inherits from swebench.yaml + shared.yaml. The ONLY difference from control:
# qi instruction appended to instance_template, plus qi + DB volume-mounted
# into the container (run_args set by a per-instance temp config generated by
# run_pilot.py).

agent:
  instance_template: |
    <pr_description>
    {{task}}
    </pr_description>

    <instructions>
    Fix the issue above by editing source files in /testbed.
    Do NOT modify test files.

    I have a sqlite code index (code-index.db), and querying tool (qi) that I want you to use instead of your usual Search/Grep/Read commands for this project.
    If you're not getting results with qi for a particular query, fall back to grep for just that query, otherwise, be persistent in using qi effectively.
    To start, run: qi --help. To get a file overview, run: qi -f <filename> --toc, on any file that looks promising.

    When done, submit your changes as a git patch:
    1. `git diff -- <your-files> > patch.txt`
    2. Verify: `cat patch.txt`
    3. Submit: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt`
    </instructions>

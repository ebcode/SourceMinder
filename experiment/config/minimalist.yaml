# Minimalist — 10 lines of instruction, let qi --help teach the rest.
# Hypothesis: Flash's worst performers were the longest prompts (deep explain
# 5k chars, 42% abandonment; noabandon_a 3.4k, worst arm). The model may need
# LESS instruction, not more — a short mandate to use qi, a workflow, and let
# `qi --help` provide the flag vocabulary. The model discovers its own tools.

agent:
  instance_template: |
    <pr_description>
    {{task}}
    </pr_description>

    <instructions>
    Fix the issue above by editing source files in /testbed.
    Do NOT modify test files.

    Use qi for code navigation. Run `qi --help` first, then `qi --list-types`.

    Workflow:
    1. `qi '*' -f <file> --toc`     -- file overview
    2. `qi <symbol> -x noise -l 10` -- find a symbol (capped)
    3. `qi <symbol> -i func -e`     -- expand a definition
    4. `qi <symbol> --usage`        -- find all callers

    When done, submit your changes as a git patch:
    1. `git diff -- <your-files> > patch.txt`
    2. Verify: `cat patch.txt`
    3. Submit (BOTH parts, single command): `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt`
    </instructions>

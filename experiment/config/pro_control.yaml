# SWE-bench Pro control arm. Same short instance_template as pro_treatment, but
# WITHOUT the qi instruction. Shared settings (step_limit, model, cwd=/app) are
# in pro_shared.yaml.

agent:
  instance_template: |
    <pr_description>
    {{task}}
    </pr_description>

    <instructions>
    Fix the issue above by editing source files in /app
    (this is already the working directory for every command — no need to cd there).
    Do NOT modify test files.

    When done, submit your changes as a git patch:
    1. `git diff -- <your-files> > patch.txt`
    2. Verify: `cat patch.txt`
    3. Submit (BOTH parts, single command): `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt`
    </instructions>

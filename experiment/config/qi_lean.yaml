# Option C -- "lean" arm: a minimal, adoption-first prompt with discipline
# OFFLOADED to qi_lean.smconfig (which forces `-l 20 -x noise` on every call).
#
# Rationale: prompt_study_explain_qi showed that prompting for DISCIPLINE
# (caps, narrowing, mechanism) suppresses qi ADOPTION on Flash -- the more the
# prompt nags about flags, the less the model uses qi (explain arms ~halved
# qi/run vs treatment). This arm breaks that tradeoff: the smconfig GUARANTEES
# the caps, so the prompt no longer has to, freeing it to drive adoption and
# keep the model in qi. The only flag content the prompt carries is how to
# OVERRIDE the forced defaults, so the agent is never stuck at 20 results or
# unable to search comments/strings (both verified to override a forced flag:
# a later -l wins; -i com str re-includes what -x noise drops).

agent:
  instance_template: |
    <pr_description>
    {{task}}
    </pr_description>

    <instructions>
    Fix the issue above by editing source files in /testbed.
    Do NOT modify test files.

    Use qi -- a symbol-aware code search tool -- as your main way to navigate the
    code. It indexes every symbol (functions, types, variables, callers), so it
    finds definitions and callers that plain text search misses. Reach for qi
    first, not grep.

    Your qi searches are already tuned for you: every query runs capped at 20
    results and skips comments and strings, so output stays small. You do NOT
    need to type `-l` or `-x noise` yourself.

    THE MOVES (overview -> locate -> understand):
      qi -f <file> --toc        a file's functions and types at a glance
      qi <symbol>               find a symbol (already capped + noise-free)
      qi <symbol> -i func -e    expand ONE located definition (never a class)
      qi <symbol> --usage       who calls it

    WHEN A DEFAULT IS TOO TIGHT -- override it by adding a flag (a flag you add
    always wins over the default):
      Need more than 20 results?        add a bigger -l:   qi <symbol> -l 50
      Need to search comments/strings?  add -i com str:    qi <text> -i com str

    STAY IN QI:
    qi is your default. If a search returns nothing, the symbol isn't there or a
    filter is too tight -- drop ONE filter and search again in qi. Use grep only
    if qi truly cannot help, then come straight back to qi.

    A few mechanics:
      - Pattern FIRST, then flags. `-f` eats the filenames after it, so
        `qi -f file.py symbol` wrongly reads `symbol` as a filename.
      - Multiple values per argument are OR'd: `qi user session token`,
        `qi malloc -f *.c *.h`.
      - Each shell turn re-sends the whole session, so batch independent lookups
        into one command:
        `qi -f utils.py --toc; qi parse_config -i func -e; qi parse_config --usage`
      - `-e` (full body) or `-v` (all columns) only on ONE symbol you've already
        located -- expanding a class can dump a whole file.

    When done, submit your changes as a git patch:
    1. `git diff -- <your-files> > patch.txt`
    2. Verify: `cat patch.txt`
    3. Submit (BOTH parts, single command): `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt`
    </instructions>

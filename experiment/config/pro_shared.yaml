# Shared overrides for both SWE-bench *Pro* arms.
# Applied after swebench.yaml, before the arm-specific config.
#
# Pro differs from Verified in ways that must override the swebench.yaml base:
#   - repo is checked out at /app (not /testbed)
#   - images use system Python (/usr/local/bin), no conda 'testbed' env, so the
#     base config's BASH_ENV conda-activation trick is unnecessary; we neutralize
#     it and use a login shell so commands get the image's standard PATH.

agent:
  step_limit: 125

model:
  model_name: "deepseek/deepseek-v4-flash"
  cost_limit: 0

environment:
  cwd: /app
  timeout: 60
  interpreter: ["bash", "-lc"]
  env:
    BASH_ENV: ""

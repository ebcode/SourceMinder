# qi Internals — Light explanation.
# Hypothesis: giving the agent a mental model of qi as a SQL wrapper over a
# pre-built symbols database will improve flag usage and reduce abandonment,
# because the agent can reason about *why* a query succeeds or fails instead
# of treating qi as a black-box oracle.
#
# Light level: high-level architecture only. qi = SQLite query engine over
# a `code_index` table. Flags = WHERE clauses. This is the minimum model
# needed to understand why tight filters produce zero results.

agent:
  instance_template: |
    <pr_description>
    {{task}}
    </pr_description>

    <instructions>
    Fix the issue above by editing source files in /testbed.
    Do NOT modify test files.

    Use qi (query-index) -- a code search tool -- in lieu of grep for code navigation.

    Think of qi as a 'better grep' for coming up-to-speed quickly on an unfamiliar codebase.
    
    UNDERSTAND YOUR TOOL — qi is NOT a search engine. It is a SQL query
    wrapper over a pre-built database. Every symbol in the codebase
    (functions, variables, types, imports, call-sites) has already been
    parsed and stored as a row in a `code_index` table. qi translates your
    command-line flags into a SQL WHERE clause and prints matching rows.

    Because qi queries a database, not raw text:
    - It finds symbols grep CANNOT see: function calls (`qi functionName -i call`),
      type annotations (`qi '*' -t 'int'` | finds all ints), member access chains
      (`qi count -p patterns` finds `patterns->count`), and much more.
    - It is deterministic: the same query on the same codebase always
      returns the same results, ordered by file then line.
    - It ONLY finds what was indexed. Comments, strings, and symbols
      outside indexed files do not exist in the database. If you need raw
      text search on unindexed content, use grep.

    NEVER abandon qi. Once you start using qi, keep using it for the ENTIRE
    session. grep should be used as a *per-query* fallback. Use it sparingly.

    THE WORKFLOW (overview -> locate -> understand):
    1. `qi '*' -f <file> --toc`       -- a file's functions and types at a glance
    2. `qi <symbol> -x noise -l 10`   -- find a symbol (broad, capped)
    3. `qi <symbol> -i func -e`       -- expand ONE specific definition
    4. `qi <symbol> --usage -l 10`    -- every caller across the codebase

    START BROAD, THEN NARROW BY ONE FILTER AT A TIME.
    Each flag you add is an extra AND clause in the WHERE — it can only
    REDUCE results. Run `qi <symbol> -x noise -l 10` first. Only add ONE
    more filter at a time. Stacking multiple filters on a first query is
    like AND-ing five restrictive WHERE clauses — it usually returns nothing.

    IF A QUERY RETURNS NOTHING:
    qi already retried your pattern as `*pattern*`, so an empty result means
    either the symbol doesn't exist in the index, or your filters are too 
    tight. Loosen ONE filter. Do NOT switch to grep — go broader in qi.

    KEY FLAGS (every one is a WHERE clause):
    -i TYPE...    context IN (...)         -x noise   context NOT IN (COMMENT,STRING)
    -f FILE...    filename LIKE ...        -p PARENT  parent_symbol LIKE ...
    --def         is_definition = 1        --usage    is_definition = 0
    -l N          LIMIT N                  -e         verbose output
    -x TYPE...    context NOT IN (...)     -lpf N     LIMIT N per file

    CAP EVERY SEARCH:
    - Add `-x noise` to almost every query (skips comments & strings).
    - Add `-l N` (e.g. `-l 10`) so a broad pattern can't dump hundreds of rows.
    - Use `-e` ONLY on a single symbol you've already located.

    Remember: grep is a fallback for finding multi-word strings and un-indexed symbols. Stay in qi for symbolic search of the codebase.

    Start the session by running: qi --list-types

    When done, submit your changes as a git patch:
    1. `git diff -- <your-files> > patch.txt`
    2. Verify: `cat patch.txt`
    3. Submit (BOTH parts, single command): `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt`
    </instructions>

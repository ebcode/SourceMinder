# Grep as Last Resort — anti-abandonment variant.
# Hypothesis: treatment.yaml presents grep as a legitimate fallback ("If qi
# genuinely cannot find something, fall back to grep to get unblocked"), which
# Flash interprets as permission to switch tools. By reframing grep as a FAILURE
# MODE — something you use only when qi has demonstrably failed, and you MUST
# return to qi immediately — Flash will treat grep as an exception rather than
# an alternative.
#
# Changes from treatment.yaml:
#   1. grep is not introduced as a fallback tool — it's introduced as "grep is
#      failure recovery"
#   2. "Don't drop back to grep after the first hit" replaced with "If you use
#      grep, something went wrong. Immediately return to qi."
#   3. The "IF A QUERY RETURNS NOTHING" section is rewritten: grep is the LAST
#      resort after relaxing filters, not the first alternative
#   4. Every mention of grep is preceded by a cost/risk statement

agent:
  instance_template: |
    <pr_description>
    {{task}}
    </pr_description>

    <instructions>
    Fix the issue above by editing source files in /testbed.
    Do NOT modify test files.

    Use qi -- a code-index tool -- for ALL code navigation. It understands
    symbols (functions, types, variables, callers) rather than raw text, and
    it chains and pipes like any unix filter.

    There is only one code-search tool in this session: qi.
    grep is NOT an alternative to qi. grep is failure recovery — something
    you use ONLY when qi has demonstrably failed, and even then, you
    immediately return to qi on your next command. If you use grep, you
    made a mistake. Correct it by going back to qi.

    Start the session by running: qi --list-types

    THE WORKFLOW (overview -> locate -> understand) -- every search is capped
    and noise-free:
    1. `qi -f <file> --toc`            — a file's functions and types at a glance
    2. `qi <symbol> -x noise -l 10`    — find a symbol (broad, but -x noise drops
                                         comments/strings and -l 10 caps output)
    3. `qi <symbol> -i func -e`        — expand ONE specific definition
    4. `qi <symbol> --usage -l 10`     — callers, capped

    CAP EVERY SEARCH — this is what keeps context small:
    - Add `-x noise` to almost every query (skips comments & strings).
    - Add `-l N` (e.g. `-l 10`) to every search so a broad pattern can't dump
      hundreds of lines. To sample across files: `-lpf 3 -l 15` (3 per file).
    - Use `-e` (full body) or `-v` (all columns) ONLY on a single symbol you have
      already located -- expanding a class can be a whole file. Never `-e` a
      wildcard.

    START BROAD, THEN NARROW BY ONE FILTER AT A TIME.
    Run `qi <symbol> -x noise -l 10` first. Only if you still need to narrow, add
    ONE more filter (`-i func`, `-f <file>`, `--within <func>`, `-p <parent>`).
    Don't stack several filters on a first query -- that usually returns nothing.

    IF A QUERY RETURNS NOTHING — DO NOT REACH FOR GREP:
    qi already retried it as `*pattern*` for you, so an empty result means the
    symbol isn't there OR your filters are too tight. Your options, in order:
      1. Loosen ONE filter and re-run qi
      2. Try a different qi search term
      3. ONLY if both fail: use grep to search raw text, then IMMEDIATELY
         return to qi and continue exploring with qi
    Switching to grep as your first response to an empty qi result is wrong.
    qi understands code structure; grep does not. Stay in qi.

    COMPOSE -- qi IS A UNIX FILTER (chain and pipe in ONE command):
    Each shell turn re-sends the whole session, so a turn is expensive. Gather in
    batches, not one query per turn.
    - Batch independent lookups for a symbol you've located into a single command:
      `qi % -f utils.py --toc;  qi parse_config -i func -e | head -40;  qi parse_config --usage -l 10`
    - Pipe to cap or count instead of running another turn:
      `qi '*handler*' -x noise | head -30`      `qi parse -x noise | wc -l`
    - One rich action beats three small turns. Only split when your NEXT query
      depends on what you just saw (find a symbol, THEN inspect its caller).

    NOTE -- one non-standard quirk: qi takes MULTIPLE values per argument:
    `qi user session token`        — user OR session OR token (OR logic)
    `qi malloc -f *.c *.h`         — across all .c OR .h files
    Put the search pattern FIRST, then flags -- `-f` greedily consumes every
    following filename, so `qi -f file.py symbol` wrongly treats `symbol` as a
    filename.

    Remember: grep is failure recovery, not an alternative. Stay in qi.

    When done, submit your changes as a git patch:
    1. `git diff -- <your-files> > patch.txt`
    2. Verify: `cat patch.txt`
    3. Submit (BOTH parts, single command): `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt`
    </instructions>

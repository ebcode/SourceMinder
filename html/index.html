<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>qi — Browser</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      background: #0b1020;
      color: #e6edf7;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #152040 0%, #0b1020 60%);
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      color: #93a1bc;
    }

    .panel {
      margin-top: 12px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(8, 13, 28, 0.8);
      backdrop-filter: blur(8px);
    }

    .status {
      margin: 0 0 12px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .card {
      padding: 12px 16px;
      border-radius: 10px;
      background: #111a33;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .label {
      display: block;
      color: #93a1bc;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }

    .value {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .error {
      color: #ff9c9c;
      white-space: pre-wrap;
    }

    #terminal-container {
      border-radius: 10px;
      overflow: hidden;
    }

    #terminal-container .xterm {
      padding: 8px;
    }
  </style>
  <link rel="stylesheet" href="./node_modules/xterm/css/xterm.css">
</head>
<body>
  <main>
    <h1>qi</h1>

    <section class="panel">
      <p id="status" class="status">Loading...</p>
      <div id="summary" class="grid" hidden></div>
      <div id="query-shell">
        <div id="terminal-container"></div>
      </div>
      <p id="error" class="error" hidden></p>
    </section>
  </main>

  <script src="./node_modules/xterm/lib/xterm.js"></script>
  <script src="./node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>qi — Browser</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      background: #0b1020;
      color: #e6edf7;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #152040 0%, #0b1020 60%);
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      color: #93a1bc;
    }

    .panel {
      margin-top: 12px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(8, 13, 28, 0.8);
      backdrop-filter: blur(8px);
    }

    .status {
      margin: 0 0 12px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .card {
      padding: 12px 16px;
      border-radius: 10px;
      background: #111a33;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .label {
      display: block;
      color: #93a1bc;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }

    .value {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .error {
      color: #ff9c9c;
      white-space: pre-wrap;
    }

    #terminal-container {
      border-radius: 10px;
      overflow: hidden;
    }

    #terminal-container .xterm {
      padding: 8px;
    }

    .project-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    #project-select {
      background: #111a33;
      color: #e6edf7;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 6px 10px;
      font: inherit;
    }

    #project-select:disabled { opacity: 0.5; }

    #project-download {
      color: #8ab4ff;
      font: inherit;
      text-decoration: underline;
      white-space: nowrap;
    }
    #project-download:hover { color: #b3ccff; }
  </style>
  <!-- xterm stylesheet + vendor scripts are injected by the ASSET_BASE
       bootstrap at end of <body> (they live on the assets origin / CDN). -->
</head>
<body>
  <main>
    <h1>qi</h1>

    <section class="panel">
      <p id="status" class="status">Loading...</p>
      <div class="project-bar">
        <label class="label" for="project-select">Project</label>
        <select id="project-select" hidden></select>
        <a id="project-download" hidden>Download .db</a>
      </div>
      <div id="summary" class="grid" hidden></div>
      <div id="query-shell">
        <div id="terminal-container"></div>
      </div>
      <p id="error" class="error" hidden></p>
    </section>
  </main>

  <!-- ASSET_BASE bootstrap: resolve the assets origin (local dev -> ./assets/,
       prod -> CDN), inject the xterm stylesheet + vendor scripts from there,
       then cache-bust app.js (and, transitively, the worker it spawns).  The
       vendor UMD bundles set globals (Terminal, FitAddon) app.js needs, so they
       must finish loading -- in order -- before app.js imports.  A static `src`
       can't carry a query string or the base without rewriting this file per
       build/env, so everything is injected dynamically. -->
  <script>
    (function () {
      var B = self.__ASSET_BASE__ =
        /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)
          ? './assets/' : 'https://cdn.sourceminder.org/';

      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = B + 'vendor/xterm/xterm.css';
      document.head.appendChild(link);

      /* Dynamically-inserted scripts default to async; async=false makes them
         execute in insertion order.  Chain so app.js boots only after both. */
      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.async = false;
          s.onload = resolve;
          s.onerror = function () { reject(new Error('Failed to load ' + src)); };
          document.body.appendChild(s);
        });
      }

      loadScript(B + 'vendor/xterm/xterm.js')
        .then(function () { return loadScript(B + 'vendor/addon-fit/addon-fit.js'); })
        .then(function () { return import('./app.js?t=' + Date.now()); })
        .catch(function (e) {
          var el = document.getElementById('error');
          if (el) { el.hidden = false; el.textContent = 'Failed to load assets: ' + e.message; }
        });
    })();
  </script>
</body>
</html>

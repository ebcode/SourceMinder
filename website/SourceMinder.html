<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SourceMinder — query-index (qi)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Commissioner:wght@400;500;600;700&family=Fira+Code:wght@400;450;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --paper:#f5f3f0; --paper-2:#ede9e3; --card:#faf8f6;
  --ink:#1b1d24; --ink-2:#4b5160; --ink-3:#7c8294;
  --rule:#e0dbd2; --rule-2:#d4cbbf;
  --blue:#3550c8; --blue-2:#2740a8; --blue-soft:#e6eaff; --peri:#dee1fb;
  --amber:#b5762a; --green:#3f7d52; --purple:#6e4480;
  /* terminal (navy product) */
  --t-bg:#0c1322; --t-panel:#0f1830; --t-card:#15203c; --t-card-2:#101a33;
  --t-rule:#233252; --t-fg:#c7d3e8; --t-dim:#5e6e8e;
  --t-white:#eaf0fc; --t-amber:#dba85f; --t-green:#6cc090; --t-blue:#5b8cff;
  --t-err:#e0728a; --t-hl-bg:#284270; --t-hl-fg:#cfe0ff;
  --maxw:1120px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Commissioner",system-ui,sans-serif;font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(100,90,80,.08) 1px,transparent 1px);
  background-size:9px 9px;background-attachment:fixed}
body.term-green{--t-bg:#05140a;--t-panel:#06180d;--t-card:#0a2113;--t-rule:#12381f;
  --t-fg:#7dd89a;--t-dim:#3f7d57;--t-white:#d6ffe4;--t-amber:#cfe36a;--t-green:#86e0a0;
  --t-blue:#86e0a0;--t-hl-bg:#1c5a32;--t-hl-fg:#d6ffe4}
a{color:var(--blue);text-decoration:none}
.mono{font-family:"Fira Code",ui-monospace,monospace}
.sm-script{font-family:"Caveat",cursive}
::selection{background:var(--peri)}

/* ---------- nav ---------- */
.sm-nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1.5px solid var(--rule)}
.sm-nav-in{max-width:var(--maxw);margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:22px}
.sm-brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
.sm-px{display:grid}
.sm-px i{display:block;width:7px;height:7px}
.sm-wordmark{font-family:"Caveat",cursive;font-weight:700;font-size:29px;line-height:1;letter-spacing:.01em}
.sm-brand-sub{font-family:"Fira Code",monospace;font-size:11px;color:var(--ink-3);align-self:flex-end;padding-bottom:5px}
.sm-nav-links{display:flex;gap:18px;margin-left:14px}
.sm-nav-links a{font-family:"Fira Code",monospace;font-size:13px;color:var(--ink-2);padding:3px 2px;border-bottom:2px solid transparent}
.sm-nav-links a.on{color:var(--ink);border-bottom-color:var(--blue)}
.sm-nav-links a:hover{color:var(--blue)}
.sm-nav-ghost{color:var(--ink-3) !important}
.sm-nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.sm-ver{font-family:"Fira Code",monospace;font-size:11px;color:var(--ink-2);border:1.5px solid var(--rule-2);border-radius:3px;padding:3px 8px;white-space:nowrap}
.sm-star{font-family:"Fira Code",monospace;font-size:12px;color:var(--ink);border:1.5px solid var(--ink);border-radius:3px;padding:3px 10px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}

/* ---------- layout ---------- */
.sm-main{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.sm-hero{padding:52px 0 24px}
.sm-hero-in{max-width:760px}
.sm-eyebrow{font-family:"Fira Code",monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.sm-h1{margin:6px 0 0;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.sm-h1 .sm-script{font-size:clamp(56px,9vw,92px);font-weight:700;line-height:.9;color:var(--ink)}
.sm-qi{font-family:"Fira Code",monospace;font-weight:500;font-size:clamp(22px,3vw,30px);color:var(--blue)}
.sm-tagline{font-family:"Caveat",cursive;font-size:clamp(28px,4vw,38px);font-weight:600;color:var(--ink);margin-top:2px;line-height:1}
.sm-lede{font-size:18px;line-height:1.55;color:var(--ink-2);max-width:600px;margin:16px 0 0}
.sm-lede em{font-style:normal;color:var(--ink);background:var(--peri);padding:0 5px;border-radius:2px}
.sm-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.sm-btn{display:inline-flex;align-items:center;gap:8px;font-family:"Fira Code",monospace;font-size:14px;
  padding:11px 18px;border:1.5px solid var(--ink);border-radius:4px}
.sm-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue-2);box-shadow:3px 3px 0 var(--ink);transition:background 120ms var(--ease-out)}
.sm-btn.primary:hover{background:#569965}
.sm-btn.ghost{background:var(--card);color:var(--ink);white-space:nowrap}
.sm-btn.ghost .t{color:var(--ink-3)}
.sm-btn.ghost:hover{border-color:var(--blue);color:var(--blue)}
.sm-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.sm-badge{display:inline-flex;font-family:"Fira Code",monospace;font-size:11px;border-radius:3px;overflow:hidden;border:1px solid rgba(0,0,0,.25);white-space:nowrap}
.sm-badge-l{background:#41434d;color:#fff;padding:3px 8px}
.sm-badge-r{color:#fff;padding:3px 8px}

/* ---------- terminal wrap ---------- */
.sm-term-wrap{margin-top:34px}
.sm-term-cap{font-family:"Fira Code",monospace;font-size:12px;color:var(--ink-2);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.sm-term-cap .t-amber{color:var(--amber)}

/* ---------- the qi terminal (product UI) ---------- */
.qt{background:var(--t-bg);border:1.5px solid var(--t-rule);border-radius:12px;overflow:hidden;
  box-shadow:0 18px 50px -22px rgba(8,14,30,.7), 0 2px 0 rgba(255,255,255,.02) inset;cursor:text}
.qt-head{display:flex;align-items:center;gap:16px;padding:18px 22px 14px}
.qt-title{font-family:"Fira Code",monospace;font-size:14px;color:var(--t-fg)}
.qt-title b{color:var(--t-white);font-weight:600}
.qt-proj{margin-left:auto;display:flex;align-items:center;gap:10px;font-family:"Fira Code",monospace;font-size:12px;color:var(--t-dim)}
.qt-proj select{font-family:"Fira Code",monospace;font-size:13px;color:var(--t-white);background:var(--t-card);
  border:1.5px solid var(--t-rule);border-radius:6px;padding:6px 30px 6px 12px;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--t-dim) 50%),linear-gradient(135deg,var(--t-dim) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.qt-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 22px 16px}
.qt-stat{background:var(--t-card);border:1.5px solid var(--t-rule);border-radius:8px;padding:13px 16px}
.qt-stat-l{font-family:"Fira Code",monospace;font-size:11px;color:var(--t-dim)}
.qt-stat-v{font-family:"Fira Code",monospace;font-size:25px;font-weight:600;color:var(--t-white);
  font-feature-settings:"tnum";margin-top:3px}
.qt-body{position:relative;padding:14px 22px 16px;font-family:"Fira Code",monospace;font-size:13px;
  line-height:1.62;color:var(--t-fg);min-height:330px;max-height:430px;overflow-y:auto;
  border-top:1.5px solid var(--t-rule);background:var(--t-panel)}
.qt-body::-webkit-scrollbar{width:9px}
.qt-body::-webkit-scrollbar-thumb{background:var(--t-rule);border-radius:6px}
.qt-line{white-space:pre-wrap;word-break:break-word}
.t-fg{color:var(--t-fg)} .t-dim{color:var(--t-dim)} .t-white{color:var(--t-white)}
.t-amber{color:var(--t-amber)} .t-green{color:var(--t-green)} .t-blue{color:var(--t-blue)}
.t-err{color:var(--t-err)}
.t-hl{background:var(--t-hl-bg);color:var(--t-hl-fg);border-radius:2px;padding:0 2px}
.qt-prompt{display:flex;align-items:center}
.qt-cursor{display:inline-block;width:8px;height:15px;background:var(--t-blue);margin-left:2px;vertical-align:middle}
.qt-cursor.on{animation:qtblink 1s steps(2,end) infinite}
@keyframes qtblink{50%{opacity:0}}
.qt-input{position:absolute;opacity:0;width:1px;height:1px;bottom:8px;left:8px;border:0;padding:0}
.qt-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 22px;border-top:1.5px solid var(--t-rule);background:var(--t-bg)}
.qt-chips-l{font-family:"Fira Code",monospace;font-size:12px;color:var(--t-dim)}
.qt-chip{font-family:"Fira Code",monospace;font-size:12px;color:var(--t-fg);background:var(--t-card);
  border:1.5px solid var(--t-rule);border-radius:5px;padding:4px 10px;cursor:pointer}
.qt-chip:hover{border-color:var(--t-blue);color:var(--t-white)}

/* ---------- section heads ---------- */
.sm-sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.sm-hash{font-family:"Fira Code",monospace;font-size:22px;color:var(--rule-2);font-weight:600}
.sm-h2{font-size:clamp(34px,5vw,46px);font-weight:700;line-height:.9;margin:0;color:var(--ink)}
.sm-sec-note{font-family:"Fira Code",monospace;font-size:12px;color:var(--ink-3);margin-left:auto}

/* ---------- why ---------- */
.sm-why,.sm-box,.sm-start{padding:46px 0;border-top:1.5px solid var(--rule)}
.sm-compare{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sm-cmp{background:var(--card);border:1.5px solid var(--rule-2);border-radius:5px;padding:20px}
.sm-cmp.hot{border-color:var(--blue);box-shadow:4px 4px 0 var(--blue-soft)}
.sm-cmp-tag{display:inline-block;font-family:"Fira Code",monospace;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-2);border:1.5px solid var(--rule-2);border-radius:3px;padding:2px 8px}
.sm-cmp-tag.on{color:var(--blue);border-color:var(--blue)}
.sm-cmp-num{font-family:"Caveat",cursive;font-weight:700;font-size:58px;line-height:.95;color:var(--ink);margin:14px 0 2px}
.sm-cmp.hot .sm-cmp-num{color:var(--blue)}
.sm-cmp-sub{font-family:"Fira Code",monospace;font-size:12px;color:var(--ink-3)}

/* ---------- collection ---------- */
.sm-box-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:26px;align-items:start}
.sm-box-lede{font-size:17px;color:var(--ink-2);margin:0;line-height:1.6;max-width:420px}
.sm-box-lede b{color:var(--ink);font-weight:600}
.sm-tree{font-family:"Fira Code",monospace;font-size:13px;line-height:1.75;color:var(--ink);
  background:var(--card);border:1.5px solid var(--rule-2);border-radius:6px;padding:18px 20px;margin:0;overflow-x:auto}
.sm-langs{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.sm-lang{display:inline-flex;align-items:center;gap:8px;font-family:"Fira Code",monospace;font-size:12px;
  border:1.5px solid var(--rule-2);border-radius:4px;padding:5px 11px;background:var(--card)}
.sm-lang b{color:var(--ink);font-weight:600}
.sm-lang span{color:var(--ink-3)}

/* ---------- quick start ---------- */
.sm-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sm-step{display:flex;gap:13px;align-items:flex-start}
.sm-step-n{flex-shrink:0;width:30px;height:30px;border:1.5px solid var(--ink);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:"Fira Code",monospace;font-weight:600;font-size:14px}
.sm-step-b{flex:1;min-width:0}
.sm-step-t{font-family:"Caveat",cursive;font-size:23px;font-weight:600;line-height:1;margin-bottom:7px}
.sm-code{font-family:"Fira Code",monospace;font-size:12.5px;color:var(--t-fg);background:var(--t-bg);
  border:1.5px solid var(--t-rule);border-radius:5px;padding:9px 12px;overflow-x:auto;white-space:nowrap}
.sm-dollar{color:var(--t-dim)}
.sm-start-links{display:flex;gap:22px;flex-wrap:wrap;margin-top:24px;font-family:"Fira Code",monospace;font-size:13px}

/* ---------- footer ---------- */
.sm-foot{margin-top:46px;background:var(--card);color:var(--ink);border-top:3px solid var(--rule)}
.sm-foot-in{max-width:var(--maxw);margin:0 auto;padding:40px 24px 26px;display:flex;gap:40px;flex-wrap:wrap;justify-content:space-between}
.sm-foot-ascii{font-family:"Fira Code",monospace;font-size:12px;line-height:1.3;color:var(--ink);margin:0}
.sm-foot-cols{display:flex;gap:46px;flex-wrap:wrap}
.sm-foot-cols>div{display:flex;flex-direction:column;gap:7px}
.sm-foot-cols span{font-family:"Fira Code",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:3px}
.sm-foot-cols a{font-family:"Fira Code",monospace;font-size:13px;color:var(--blue)}
.sm-foot-cols a:hover{color:var(--ink)}
.sm-foot-bar{max-width:var(--maxw);margin:0 auto;padding:14px 24px 30px;display:flex;gap:18px;flex-wrap:wrap;
  align-items:center;border-top:1.5px solid var(--rule);font-family:"Fira Code",monospace;font-size:11px;color:var(--ink-2)}
.sm-counter{background:var(--ink);color:#fff;border:1.5px solid var(--ink);border-radius:3px;padding:2px 8px;letter-spacing:.18em}

@media(max-width:880px){
  .qt-stats{grid-template-columns:repeat(2,1fr)}
  .sm-compare,.sm-steps{grid-template-columns:1fr}
  .sm-box-grid{grid-template-columns:1fr}
  .sm-sec-note{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="sm-data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="sm-terminal.jsx"></script>
<script type="text/babel" src="sm-sections.jsx"></script>

<script type="text/babel">
const { useEffect } = React;
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#447a54",
  "warmPaper": true,
  "termTheme": "navy"
}/*EDITMODE-END*/;

function App(){
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const { Nav, Hero, WhyQi, Collection, GetStarted, Footer } = window.SM_SECTIONS;

  useEffect(()=>{
    document.documentElement.style.setProperty('--blue', t.accent);
  }, [t.accent]);

  return (
    <React.Fragment>
      <Nav/>
      <main className="sm-main">
        <Hero/>
        <WhyQi/>
        <Collection/>
        <GetStarted/>
      </main>
      <Footer/>

      <TweaksPanel>
        <TweakSection label="Brand" />
        <TweakColor label="Accent" value={t.accent}
          options={['#447a54','#3550c8','#0056ff','#6e4480','#b5762a']}
          onChange={(v)=>setTweak('accent', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

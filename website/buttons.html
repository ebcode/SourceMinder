<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="colors_and_type_buttons.css">
<style>
  body { margin: 0; padding: 22px; background: #fff; font-family: var(--font-sans); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .lbl { font-family: var(--font-mono); font-size: 10.5px; color: var(--color-fg-3); width: 80px; letter-spacing: .04em; text-transform: uppercase; flex-shrink: 0; }

  /* ════════════════════════════════════════════════════════
     STATIONARY-SHADOW WRAPPER
     ─────────────────────────────────────────────────────
     The shadow lives on .btn-wrap::after and never moves.
     Only the .btn element translates into it on hover/press.
     Animating box-shadow + transform simultaneously causes
     drift — this wrapper approach eliminates it entirely.

     Usage:
       <span class="btn-wrap btn-wrap--{variant}">
         <button class="btn {variant}">…</button>
       </span>

     Ghost and icon-only buttons carry no shadow — use bare .btn.
  ════════════════════════════════════════════════════════ */
  .btn-wrap {
    display: inline-flex;
    position: relative;
    margin: 0 2px 2px 0;
  }
  .btn-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--_sw-color, rgba(10,10,11,0.18));
    border-radius: var(--_sw-radius, var(--radius-sm));
    transform: translate(var(--_sw-x, 2px), var(--_sw-y, 2px));
    z-index: 0;
  }
  .btn-wrap .btn {
    position: relative;
    z-index: 1;
    box-shadow: none;
    transform: translate(0, 0);
    transition: transform 100ms var(--ease-out), background-color 120ms var(--ease-out);
  }
  .btn-wrap:hover  .btn { transform: translate(1px, 1px); }
  .btn-wrap:active .btn { transform: translate(2px, 2px); }
  .btn-wrap:has(.btn:disabled) { opacity: 0.38; pointer-events: none; }

  /* Variant shadow colors */
  .btn-wrap--primary   { --_sw-color: var(--pt-indigo); }
  .btn-wrap--secondary { --_sw-color: rgba(10,10,11,0.18); }
  .btn-wrap--danger    { --_sw-color: var(--pt-red-lo); }

  /* Pixel CTA: larger offset, square, ink */
  .btn-wrap--pixel {
    --_sw-color: var(--pt-ink);
    --_sw-x: 4px; --_sw-y: 4px;
    --_sw-radius: 0px;
    margin: 0 4px 4px 0;
  }
  .btn-wrap--pixel:hover  .btn { transform: translate(2px, 2px); }
  .btn-wrap--pixel:active .btn { transform: translate(4px, 4px); }

  /* ════ Base button ════ */
  .btn {
    appearance: none;
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 10px 16px; border-radius: var(--radius-sm);
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--color-border-strong);
    box-shadow: none;
  }
  .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  /* Primary */
  .btn.primary { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--pt-indigo); }
  .btn-wrap--primary:hover  .btn.primary { background: var(--color-primary-hover); }
  .btn-wrap--primary:active .btn.primary { background: var(--color-primary-pressed); }

  /* Secondary */
  .btn.secondary { background: var(--pt-paper); color: var(--color-fg); border-color: var(--color-border-strong); }
  .btn-wrap--secondary:hover  .btn.secondary { background: var(--color-bg-subtle); }
  .btn-wrap--secondary:active .btn.secondary { background: var(--pt-slate-6); }

  /* Ghost — no wrapper needed */
  .btn.ghost { background: transparent; color: var(--color-fg); border-color: var(--color-border); transition: background-color 100ms var(--ease-out), border-color 100ms var(--ease-out); }
  .btn.ghost:hover  { background: var(--color-bg-subtle); border-color: var(--color-border-strong); }
  .btn.ghost:active { background: var(--pt-slate-6); }

  /* Danger */
  .btn.danger { background: var(--color-danger); color: #fff; border-color: var(--pt-red-lo); }
  .btn-wrap--danger:hover  .btn.danger { background: #c45362; }
  .btn-wrap--danger:active .btn.danger { background: var(--pt-red-lo); }

  /* Pixel CTA */
  .btn.pixel {
    background: #f5e9d3; color: var(--pt-ink);
    border: 1px solid var(--pt-ink); border-radius: var(--radius-0);
    font-weight: 600; padding: 12px 18px;
  }
  .btn-wrap--pixel:hover .btn.pixel { background: #ffe9a8; }

  .btn.sm { padding: 6px 10px; font-size: 13px; }
</style></head><body>

  <div class="row">
    <span class="lbl">default</span>
    <span class="btn-wrap btn-wrap--primary"><button class="btn primary">See our work →</button></span>
    <span class="btn-wrap btn-wrap--secondary"><button class="btn secondary">Book a call</button></span>
    <button class="btn ghost">Learn more</button>
    <span class="btn-wrap btn-wrap--danger"><button class="btn danger">Delete project</button></span>
  </div>

  <div class="row">
    <span class="lbl">pixel cta</span>
    <span class="btn-wrap btn-wrap--pixel"><button class="btn pixel">Start a project →</button></span>
    <span style="font-family:var(--font-mono);font-size:11px;color:var(--color-fg-3)">stationary shadow — larger offset, ink color</span>
  </div>

  <div class="row">
    <span class="lbl">small</span>
    <span class="btn-wrap btn-wrap--primary"><button class="btn primary sm">Save</button></span>
    <span class="btn-wrap btn-wrap--secondary"><button class="btn secondary sm">Cancel</button></span>
    <button class="btn ghost sm">+ Add row</button>
  </div>

</body></html>
